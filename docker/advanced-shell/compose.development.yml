name: assistantmd-advanced-shell-dev

services:
  shell:
    build:
      context: ../..
      dockerfile: docker/advanced-shell/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${ADVANCED_SHELL_BIND_ADDRESS:-127.0.0.1}:${ADVANCED_SHELL_HOST_PORT:-22222}:2222"
    networks:
      default:
        aliases:
          - assistantmd-shell
    volumes:
      - ${ADVANCED_SHELL_COMPANION_KEY_ROOT:?set ADVANCED_SHELL_COMPANION_KEY_ROOT}:/run/assistantmd-shell/host-identity
      - ${ADVANCED_SHELL_HOST_PUBLIC_ROOT:?set ADVANCED_SHELL_HOST_PUBLIC_ROOT}:/run/assistantmd-shell/host-public
      - ${ADVANCED_SHELL_CLIENT_PUBLIC_ROOT:?set ADVANCED_SHELL_CLIENT_PUBLIC_ROOT}:/run/assistantmd-shell/client-public:ro
      - type: volume
        source: workspace
        target: /workspace
      - type: volume
        source: home
        target: /home/assistantmd-shell
    read_only: true
    tmpfs:
      - /run/sshd:size=1m,mode=0755
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "sshd -t -f /etc/ssh/sshd_config"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  workspace:
  home:
