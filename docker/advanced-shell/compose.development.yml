name: assistantmd-advanced-shell-dev

services:
  key-init:
    build:
      context: ../..
      dockerfile: docker/advanced-shell/Dockerfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        cp /source/client_identity.pub /target/assistantmd_shell_client.pub;
        cp /source/ssh_host_ed25519_key /target/ssh_host_ed25519_key;
        chmod 0700 /target;
        chmod 0644 /target/assistantmd_shell_client.pub;
        chmod 0600 /target/ssh_host_ed25519_key
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${ADVANCED_SHELL_CLIENT_PUBLIC_KEY:?set ADVANCED_SHELL_CLIENT_PUBLIC_KEY}
        target: /source/client_identity.pub
        read_only: true
      - type: bind
        source: ${ADVANCED_SHELL_COMPANION_HOST_KEY:?set ADVANCED_SHELL_COMPANION_HOST_KEY}
        target: /source/ssh_host_ed25519_key
        read_only: true
      - type: volume
        source: runtime_keys
        target: /target

  shell:
    build:
      context: ../..
      dockerfile: docker/advanced-shell/Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      key-init:
        condition: service_completed_successfully
    ports:
      - "${ADVANCED_SHELL_BIND_ADDRESS:-127.0.0.1}:${ADVANCED_SHELL_HOST_PORT:-22222}:2222"
    networks:
      default:
        aliases:
          - assistantmd-shell
    volumes:
      - type: volume
        source: runtime_keys
        target: /run/assistantmd-shell
        read_only: true
      - type: volume
        source: workspace
        target: /workspace
      - type: volume
        source: home
        target: /home/assistantmd-shell
    read_only: true
    tmpfs:
      - /run/sshd:size=1m,mode=0755
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "sshd -t -f /etc/ssh/sshd_config"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  workspace:
  home:
  runtime_keys:
